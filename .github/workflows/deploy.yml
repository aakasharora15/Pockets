name: Deploy

# Deploys to Firebase Hosting (and the Firestore rules and indexes) once CI has passed on main,
# using exactly the commit CI checked. A red CI run never deploys. It can also be run by hand.
# Needs three repository secrets (Settings › Secrets and variables › Actions):
#   FIREBASE_PROJECT_ID       your Firebase project id
#   FIREBASE_WEB_CONFIG       the web app config as JSON, e.g. {"apiKey":"…","authDomain":"…",…}
#   FIREBASE_SERVICE_ACCOUNT  a service account key (JSON) with the Firebase Admin role
# Without them (for example on a fork) the deploy job is skipped.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # From CI: only a successful run of a push to main (not a pull request).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      HAS_SECRETS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_WEB_CONFIG != '' && secrets.FIREBASE_PROJECT_ID != '' }}
    steps:
      - name: Skip when secrets are missing
        if: env.HAS_SECRETS != 'true'
        run: echo "Firebase secrets not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_SECRETS == 'true'
        run: npm ci
      - name: Write Firebase web config
        if: env.HAS_SECRETS == 'true'
        env:
          WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: printf 'const firebaseConfig = %s;\nexport default firebaseConfig;\n' "$WEB_CONFIG" > src/firebase.config.ts
      - if: env.HAS_SECRETS == 'true'
        run: npm run build
      - name: Deploy hosting, rules and indexes
        if: env.HAS_SECRETS == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore --project "$PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
