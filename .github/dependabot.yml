# Weekly pull requests for dependency and GitHub Actions updates; CI runs on each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      firebase:
        patterns: ['firebase', '@firebase/*', 'firebase-tools']
      react:
        patterns: ['react', 'react-dom', 'react-router*', '@types/react*']
      tooling:
        patterns: ['vite', 'vite-plugin-pwa', '@vitejs/*', 'vitest', 'typescript', 'oxlint', 'prettier', '@playwright/test']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
