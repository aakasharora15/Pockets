<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05080F" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Track your own spending, and share a Pocket with the people you live with. In any currency." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spendr" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/spendr-icon-dark.svg" />
    <title>Spendr</title>
    <script>
      // Theme before first paint (see src/lib/theme.ts). The light theme needs dark status bar text.
      (function () {
        var s = 'dark';
        try { s = localStorage.getItem('spendr.theme') || 'dark'; } catch (e) {}
        var t = s === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : s === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        // Installed on iPhone, iOS 26 gives the page a window shorter than the screen by the status
        // bar's height (852 screen, 793 window on an iPhone 15) while drawing the full screen, so the
        // page stops short of the bottom. Size it by 100lvh instead (see base.css). It's tried once
        // and kept only if you confirm it looks right (see main.tsx); 'off' turns it off.
        if (navigator.standalone === true) {
          var fit = null;
          try { fit = localStorage.getItem('spendr.fit'); } catch (e) {}
          var tall = Math.max(screen.width, screen.height) - Math.max(innerWidth, innerHeight) >= 20;
          if (fit === 'on' || (fit !== 'off' && tall)) document.documentElement.classList.add('fit-screen');
          if (fit !== 'on' && fit !== 'off' && tall) document.documentElement.dataset.fitTrial = '1';
        }
        if (t === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F2F2F7');
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'light');
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
